name: smoke
display_name: Smoke Test Agent
description: "Minimal validation template for Fleet provisioning and GCE smoke tests"
version: "2026.3.28"
visibility: admin
base_image: agent-golden-image
service_name: smoke-gateway

defaults:
  memory: "2GB"
  cpu: "1"
  disk: "20GB"
  model_provider: openrouter
  model: "smoke-test"
  timezone: "America/New_York"
  # Smoke leads the bridge cutover (credentials-vault KTD6 order:
  # smoke -> internal hermes -> default-on). Bridge mode means NO provider key
  # in the guest; the host-side LLM gateway attaches it at call time and the run
  # token (RAAVA_RUN_TOKEN) is injected at microVM create. Requires the raava
  # pool provider — selecting any other provider fails at provision time.
  secrets_mode: bridge
  # Run-token spend caps (CAPS unit / review P0 #5, P1 #10). The host-side LLM
  # gateway enforces these per run, deny-by-default: unset/zero refuses every
  # brokered model call. These are the template ceiling — a request may lower
  # them but never raise them, and tier resolution (Starter/Pro/Enterprise) sets
  # the default when no template knob is present. Smoke runs a tiny probe, so the
  # Starter floor is plenty.
  run_token_budget_usd: 2.00
  run_token_rate_limit_per_min: 60

# Bridge-mode runtime config (credentials-vault §U4/§U5). Default-deny egress
# lets the guest reach the bridge LLM gateway + DNS; allowlist adds explicit
# per-template destinations (none needed for the smoke probe).
bridge:
  allowlist: []

fields: []

integrations: []

health_check: "pgrep -f 'http.server 18888'"

providers:
  lxd:
    image: agent-golden-image
  gce:
    machine_image: raava-base-hermes
    machine_type: e2-small
    disk_size_gb: 20
  docker:
    image: ubuntu:24.04
  raava:
    image: agent-golden-image
