[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monolith-engine"
version = "0.1.0"
description = "Open single-node engine for Monolith — providers, storage, workflows, chat-exec. Runs in-process with no server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Raava" }]
dependencies = ["pydantic>=2.0", "jinja2>=3.1", "PyYAML>=6.0", "PyJWT>=2.8", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["monolith_engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.package-data]
monolith_engine = ["templates/**/*", "images/**/*"]
